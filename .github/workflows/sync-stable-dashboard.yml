name: Sync stable dashboard assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stable-assets:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Sync stable dashboard assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download stable assets
        run: |
          set -euo pipefail
          curl -fsSL 'https://map.jianengzhou.com/3k/index.html?v=github-sync-20260605' -o index.html
          curl -fsSL 'https://map.jianengzhou.com/3k/src/app.js?v=github-sync-20260605' -o src/app.js
          curl -fsSL 'https://map.jianengzhou.com/3k/styles.css?v=github-sync-20260605' -o styles.css
      - name: Commit synced assets
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html src/app.js styles.css; then
            echo 'No dashboard asset changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/app.js styles.css
          git commit -m 'Sync stable dashboard assets'
          git push
